apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-coding
  namespace: bluebank
  labels:
    app: vllm-coding
    workload: swe-coding
    workload-class: internal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-coding
  template:
    metadata:
      labels:
        app: vllm-coding
        workload: swe-coding
        workload-class: internal
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.19.1
        imagePullPolicy: Always
        args:
        - --model
        - /models/granite-4.1-8b
        - --max-model-len
        - "32768"
        - --gpu-memory-utilization
        - "0.80"
        - --max-num-seqs
        - "10"
        - --port
        - "8000"
        - --served-model-name
        - granite-coding
        - --enable-auto-tool-choice
        - --tool-call-parser
        - granite4
        securityContext:
          privileged: true
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
        - mountPath: /dev/shm
          name: shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: worker3.bluebank-demo-2.cp.fyre.ibm.com
      securityContext:
        runAsUser: 0
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /opt/models
          type: Directory
        name: models
      - emptyDir:
          medium: Memory
          sizeLimit: 4Gi
        name: shm