# PrometheusQueryMapping for NVIDIA DCGM exporter.
# Based on:
# https://github.com/IBM/turbonomic-container-platform/blob/main/turbo-metrics/samples/metrics_v1alpha1_nvidia-dcgm-exporter.yaml
#
# NOTE: GPU_I_PROFILE (line 20 of the upstream sample) is commented out below.
# This cluster uses whole (non-MIG-partitioned) H100 GPUs.  The GPU_I_PROFILE
# label is only present on MIG slice metrics; keeping it causes the gpuModel
# attribute match to fail, which prevents Turbonomic from discovering the
# nvidiaGPU entities entirely.
apiVersion: metrics.turbonomic.io/v1alpha1
kind: PrometheusQueryMapping
metadata:
  name: nvidia-dcgm-exporter
  labels:
    mapping: nvidia-dcgm-exporter
spec:
  entities:
  - type: nvidiaGPU
    attributes:
    - label: exported_container
      name: container
    - label: modelName
      # label is kept in addition to labels for backward compatibility
      labels:
      - modelName
      # - GPU_I_PROFILE   # MIG only — commented out: this cluster uses whole H100 GPUs (no MIG)
      # delimeter: "-MIG-"  # only needed when GPU_I_PROFILE is active
      name: gpuModel
    - label: gpu
      name: gpuNum
    - isIdentifier: true
      label: UUID
      # label is kept in addition to labels for backward compatibility
      labels:
        - UUID
        - GPU_I_ID
      name: id
    - label: exported_namespace
      name: namespace
    - as: $hostIP
      label: instance
      matches: (?P<hostIP>\d{1,3}(?:\.\d{1,3}){3}(?::\d{1,5})??)
      name: nodeIp
    - label: Hostname
      name: nodeName
    - label: exported_pod
      name: pod
    - label: exported_pod
      as: $1
      matches: ^(.*)-[a-f0-9]{10}-[a-z0-9]{5}$|(.*)-[a-f0-9]{0,10}[a-z0-9]{5}$
      name: deploymentName
    metrics:
    - type: gpu
      queries:
      - type: used
        # DCGM_FI_PROF_GR_ENGINE_ACTIVE works for both MIG and whole GPU.
        # If unavailable, replace with DCGM_FI_DEV_GPU_UTIL{}[DURATION]/100
        # (the two metrics differ by a factor of 100).
        promql: avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{}[10m])
    - type: gpuMem
      queries:
      - type: used
        # "X OR Y - Z" pattern: only two of {used, total, free} are available.
        promql: (avg_over_time(DCGM_FI_DEV_FB_USED[10m]) OR avg_over_time(DCGM_FI_DEV_FB_TOTAL[10m])
          - avg_over_time(DCGM_FI_DEV_FB_FREE[10m])) / 1024
      - type: capacity
        # Capacity is a constant; no moving average needed.
        promql: (DCGM_FI_DEV_FB_TOTAL OR DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) / 1024
