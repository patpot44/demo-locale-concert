apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-coding
  namespace: bluebank
  labels:
    app: vllm-coding
    workload: swe-coding
    workload-class: internal
spec:
  to:
    kind: Service
    name: vllm-coding
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

