<!-- Blue Bank AI Chat Side Panel -->
<style>
  .ai-square-button {
    width: 36px !important;
    height: 36px !important;
    padding: 0 !important;
    background: #0f62fe !important;
    border: none !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    transition: background 0.2s !important;
    margin-left: 0.5rem !important;
  }
  .ai-square-button:hover {
    background: #0050e6 !important;
  }
  .ai-square-button:focus {
    outline: 2px solid #0f62fe !important;
    outline-offset: 2px !important;
  }
  .ai-square-button svg {
    display: block !important;
    fill: #ffffff !important;
  }

  #ai-chat-panel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 420px;
    height: 100vh;
    background: #ffffff;
    box-shadow: -2px 0 16px rgba(0, 0, 0, 0.15);
    z-index: 10000;
    transition: right 0.3s ease-in-out;
    display: flex;
    flex-direction: column;
  }

  #ai-chat-panel.open {
    right: 0;
  }

  .ai-chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e0e0e0;
    background: #f4f4f4;
  }

  .ai-chat-header h3 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: #161616;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .ai-chat-header svg {
    width: 20px;
    height: 20px;
    fill: #0f62fe;
  }

  .ai-chat-header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .ai-chat-header-btn {
    background: none;
    border: none;
    color: #525252;
    cursor: pointer;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: background 0.2s;
  }

  .ai-chat-header-btn:hover {
    background: #e0e0e0;
  }

  .ai-chat-header-btn svg {
    width: 18px;
    height: 18px;
    fill: #525252;
  }

  .ai-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    background: #ffffff;
  }

  .ai-chat-message {
    margin-bottom: 1.5rem;
    display: flex;
    gap: 0.75rem;
    animation: fadeInMessage 0.3s ease-out;
  }

  @keyframes fadeInMessage {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .ai-chat-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .ai-chat-message.assistant .ai-chat-avatar {
    background: linear-gradient(135deg, #4589ff, #0f62fe);
    color: #ffffff;
  }

  .ai-chat-message.user .ai-chat-avatar {
    background: #e0e0e0;
    color: #525252;
  }

  .ai-chat-bubble {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    line-height: 1.5;
    font-size: 0.875rem;
    color: #161616;
  }

  .ai-chat-message.assistant .ai-chat-bubble {
    background: #f4f4f4;
    border: 1px solid #e0e0e0;
  }

  .ai-chat-message.user .ai-chat-bubble {
    background: #e0f2ff;
    border: 1px solid #b8daff;
  }

  .ai-chat-intro {
    text-align: left;
  }

  .ai-chat-intro h4 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 0.5rem 0;
    color: #161616;
  }

  .ai-chat-intro p {
    margin: 0 0 1rem 0;
    color: #525252;
    font-size: 0.875rem;
  }

  .ai-chat-suggestions {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .ai-chat-suggestion {
    background: #ffffff;
    border: 1px solid #0f62fe;
    color: #0f62fe;
    padding: 0.75rem 1rem;
    border-radius: 20px;
    font-size: 0.875rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-family: inherit;
    width: 100%;
  }

  .ai-chat-suggestion:hover {
    background: #e0f2ff;
    border-color: #0050e6;
    color: #0050e6;
  }

  .ai-chat-typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }

  .ai-chat-typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8d8d8d;
    animation: typingBlink 1.4s infinite;
  }

  .ai-chat-typing span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .ai-chat-typing span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes typingBlink {
    0%, 80%, 100% {
      opacity: 0.3;
    }
    40% {
      opacity: 1;
    }
  }

  .ai-chat-input-area {
    padding: 1rem 1.5rem;
    border-top: 1px solid #e0e0e0;
    background: #f4f4f4;
  }

  .ai-chat-input-wrapper {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }

  .ai-chat-input-wrapper textarea {
    flex: 1;
    resize: none;
    border: 1px solid #8d8d8d;
    border-radius: 8px;
    background: #ffffff;
    color: #161616;
    padding: 0.75rem;
    font-family: inherit;
    font-size: 0.875rem;
    line-height: 1.5;
    min-height: 44px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ai-chat-input-wrapper textarea::placeholder {
    color: #8d8d8d;
  }

  .ai-chat-input-wrapper textarea:focus {
    border-color: #0f62fe;
  }

  .ai-chat-send-btn {
    width: 44px;
    height: 44px;
    background: #0f62fe;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .ai-chat-send-btn:hover {
    background: #0050e6;
  }

  .ai-chat-send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .ai-chat-send-btn svg {
    width: 20px;
    height: 20px;
    fill: #ffffff;
  }

  .ai-chat-messages::-webkit-scrollbar {
    width: 6px;
  }

  .ai-chat-messages::-webkit-scrollbar-track {
    background: transparent;
  }

  .ai-chat-messages::-webkit-scrollbar-thumb {
    background: #c6c6c6;
    border-radius: 3px;
  }

  @media (max-width: 768px) {
    #ai-chat-panel {
      width: 100%;
      right: -100%;
    }
  }
</style>

<div id="ai-chat-panel">
  <div class="ai-chat-header">
    <h3>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path stroke-width="0" d="M15 19l-1.4141 1.4141 3.5859 3.5859H4v-13h-2v13c0 1.1046.8954 2 2 2h13.1719l-3.5859 3.5859 1.4141 1.4141 6-6-6-6zM24 18v-2h2V4h-2v-2h6v2h-2v12h2v2h-6z"></path>
        <path stroke-width="0" d="m21,18h2l-5.5-16-3,.0088-5.5,15.9912h2l1.3333-4h7.3335l1.3333,4Zm-8-6l3-9,3,9h-6Z"></path>
      </svg>
      AI Assistant
    </h3>
    <div class="ai-chat-header-actions">
      <button class="ai-chat-header-btn" onclick="restartAIChat()" title="Restart chat" aria-label="Restart">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M13,9c0,2.8-2.2,5-5,5s-5-2.2-5-5s2.2-5,5-5h3.1L9.3,5.8L10,6.5l3-3l-3-3L9.3,1.2L11.1,3H8C4.7,3,2,5.7,2,9s2.7,6,6,6 s6-2.7,6-6H13z"></path>
        </svg>
      </button>
      <button class="ai-chat-header-btn" onclick="toggleAIChat()" title="Collapse chat" aria-label="Collapse">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="M28,4H4C2.9,4,2,4.9,2,6v20c0,1.1,0.9,2,2,2h24c1.1,0,2-0.9,2-2V6C30,4.9,29.1,4,28,4z M10,26H4V6h6V26z M28,15H17.8 l3.6-3.6L20,10l-6,6l6,6l1.4-1.4L17.8,17H28v9H12V6h16V15z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="ai-chat-messages" id="aiChatMessages">
    <!-- Intro message will be added here by JavaScript -->
  </div>

  <div class="ai-chat-input-area">
    <div class="ai-chat-input-wrapper">
      <textarea 
        id="aiChatInput" 
        placeholder="Type something..." 
        rows="1"
        onkeydown="handleAIChatKey(event)"
        oninput="autoResizeAIChat(this)"></textarea>
      <button class="ai-chat-send-btn" id="aiChatSendBtn" onclick="sendAIMessage()" disabled>
        <svg viewBox="0 0 32 32">
          <path d="M28 16L4 27l3-11L4 5zm-3 0L9.5 16H7l2.2-8z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const aiChatHistory = [];
  let aiChatStreaming = false;
  const AI_CHAT_API_URL = 'https://bank-chat-demoapps-bank-anthos.apps.o1-968455.cp.fyre.ibm.com/api/chat';

  const $aiChatPanel = document.getElementById('ai-chat-panel');
  const $aiChatMessages = document.getElementById('aiChatMessages');
  const $aiChatInput = document.getElementById('aiChatInput');
  const $aiChatSendBtn = document.getElementById('aiChatSendBtn');

  // Initialize with intro message
  function initAIChat() {
    if (aiChatHistory.length === 0) {
      addIntroMessage();
    }
  }

  function addIntroMessage() {
    const introMessage = {
      role: 'assistant',
      content: 'Hi and welcome to Blue Bank! Get started by asking me what I can help you with today or select one of the quick-start questions:'
    };
    aiChatHistory.push(introMessage);
    
    const messageDiv = document.createElement('div');
    messageDiv.className = 'ai-chat-message assistant';
    
    const avatar = document.createElement('div');
    avatar.className = 'ai-chat-avatar';
    avatar.textContent = 'AI';
    
    const bubble = document.createElement('div');
    bubble.className = 'ai-chat-bubble ai-chat-intro';
    
    const heading = document.createElement('h4');
    heading.textContent = 'Hi and welcome to Blue Bank!';
    
    const text = document.createElement('p');
    text.textContent = 'Get started by asking me what I can help you with today or select one of the quick-start questions:';
    
    const suggestions = document.createElement('div');
    suggestions.className = 'ai-chat-suggestions';
    
    const suggestionTexts = [
      "What's my current balance?",
      "Show me my recent transactions",
      "How do I transfer funds?",
      "What are your customer service hours?"
    ];
    
    suggestionTexts.forEach(text => {
      const btn = document.createElement('button');
      btn.className = 'ai-chat-suggestion';
      btn.textContent = text;
      btn.onclick = () => useAISuggestion(text);
      suggestions.appendChild(btn);
    });
    
    bubble.appendChild(heading);
    bubble.appendChild(text);
    bubble.appendChild(suggestions);
    
    messageDiv.appendChild(avatar);
    messageDiv.appendChild(bubble);
    $aiChatMessages.appendChild(messageDiv);
  }

  function restartAIChat() {
    // Clear history and messages
    aiChatHistory.length = 0;
    $aiChatMessages.innerHTML = '';
    // Re-initialize with intro message
    addIntroMessage();
  }

  function toggleAIChat() {
    $aiChatPanel.classList.toggle('open');
    if ($aiChatPanel.classList.contains('open')) {
      initAIChat();
      $aiChatInput.focus();
    }
  }

  function useAISuggestion(text) {
    $aiChatInput.value = text;
    $aiChatSendBtn.disabled = false;
    sendAIMessage();
  }

  function addAIMessage(role, content) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `ai-chat-message ${role}`;
    
    const avatar = document.createElement('div');
    avatar.className = 'ai-chat-avatar';
    avatar.textContent = role === 'user' ? 'You' : 'AI';
    
    const bubble = document.createElement('div');
    bubble.className = 'ai-chat-bubble';
    bubble.textContent = content || '';
    
    messageDiv.appendChild(avatar);
    messageDiv.appendChild(bubble);
    $aiChatMessages.appendChild(messageDiv);
    $aiChatMessages.scrollTop = $aiChatMessages.scrollHeight;
    
    return bubble;
  }

  function addAITyping() {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'ai-chat-message assistant';
    messageDiv.id = 'aiTyping';
    
    const avatar = document.createElement('div');
    avatar.className = 'ai-chat-avatar';
    avatar.textContent = 'AI';
    
    const bubble = document.createElement('div');
    bubble.className = 'ai-chat-bubble';
    bubble.innerHTML = '<div class="ai-chat-typing"><span></span><span></span><span></span></div>';
    
    messageDiv.appendChild(avatar);
    messageDiv.appendChild(bubble);
    $aiChatMessages.appendChild(messageDiv);
    $aiChatMessages.scrollTop = $aiChatMessages.scrollHeight;
  }

  function removeAITyping() {
    const typing = document.getElementById('aiTyping');
    if (typing) typing.remove();
  }

  function autoResizeAIChat(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    $aiChatSendBtn.disabled = !el.value.trim() || aiChatStreaming;
  }

  function handleAIChatKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendAIMessage();
    }
  }

  async function sendAIMessage() {
    const text = $aiChatInput.value.trim();
    if (!text || aiChatStreaming) return;

    $aiChatInput.value = '';
    $aiChatInput.style.height = 'auto';
    $aiChatSendBtn.disabled = true;

    addAIMessage('user', text);
    aiChatHistory.push({ role: 'user', content: text });
    
    addAITyping();
    aiChatStreaming = true;

    try {
      const response = await fetch(AI_CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: aiChatHistory.slice(-4) })
      });

      removeAITyping();
      const bubble = addAIMessage('assistant', '');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullContent = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') break;

          try {
            const data = JSON.parse(payload);
            if (data.error) {
              bubble.textContent = `Error: ${data.error}`;
              bubble.style.color = '#da1e28';
              break;
            }
            if (data.content) {
              fullContent += data.content;
              bubble.textContent = fullContent;
              $aiChatMessages.scrollTop = $aiChatMessages.scrollHeight;
            }
          } catch (e) {}
        }
      }

      if (fullContent && !/(.)\1{20,}/.test(fullContent) && fullContent.length >= 5) {
        aiChatHistory.push({ role: 'assistant', content: fullContent });
      }
    } catch (err) {
      removeAITyping();
      const bubble = addAIMessage('assistant', `Connection error: ${err.message}`);
      bubble.style.color = '#da1e28';
    }

    aiChatStreaming = false;
    $aiChatSendBtn.disabled = !$aiChatInput.value.trim();
  }
</script>
