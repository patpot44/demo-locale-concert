server.port=8080
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:concert-bank-kafka-kafka-bootstrap.demoapps-bank-anthos.svc:9092}
spring.kafka.consumer.group-id=transaction-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=anthos.samples.bankofanthos.transactionprocessor.Transaction
spring.kafka.consumer.properties.spring.json.type.mapping=anthos.samples.bankofanthos.ledgerwriter.Transaction:anthos.samples.bankofanthos.transactionprocessor.Transaction

# Consumer rebalance tuning - detect dead consumers faster
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.consumer.properties.max.poll.interval.ms=30000
